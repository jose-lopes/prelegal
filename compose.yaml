name: prelegal

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app/frontend
      - ./templates:/app/templates:ro
      - frontend_dependencies:/app/frontend/node_modules
      - frontend_next:/app/frontend/.next
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]

  checks:
    profiles: ["test"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    init: true
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    command: ["sh", "-c", "npm run lint && npm run test && npm run build && npm run typecheck"]

  e2e:
    profiles: ["test"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: browser-tests
    init: true
    shm_size: 1gb
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    command: ["sh", "-c", "npm run build && npm run test:e2e"]

  tooling:
    profiles: ["tools"]
    image: node:22-bookworm-slim
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app/frontend
    environment:
      npm_config_cache: /tmp/npm-cache
    volumes:
      - ./frontend:/app/frontend
    entrypoint: ["npm"]
    command: ["--version"]

volumes:
  frontend_dependencies:
  frontend_next:
