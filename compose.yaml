name: prelegal

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    tmpfs:
      - /tmp
    environment:
      OPENROUTER_PM_API_KEY: ${OPENROUTER_PM_API_KEY:-}

  frontend:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      API_PROXY_URL: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./frontend:/app/frontend
      - ./templates:/app/templates:ro
      - ./backend/documents.json:/app/backend/documents.json:ro
      - frontend_dependencies:/app/frontend/node_modules
      - frontend_next:/app/frontend/.next
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]

  checks:
    profiles: ["test"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    init: true
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    command: ["sh", "-c", "npm run lint && npm run test && npm run build && npm run typecheck"]

  backend-checks:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-checks

  e2e:
    profiles: ["test"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: browser-tests
    init: true
    shm_size: 1gb
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BASE_URL: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    command: ["npm", "run", "test:e2e"]

  tooling:
    profiles: ["tools"]
    image: node:22-bookworm-slim
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app/frontend
    environment:
      npm_config_cache: /tmp/npm-cache
    volumes:
      - ./frontend:/app/frontend
    entrypoint: ["npm"]
    command: ["--version"]

volumes:
  frontend_dependencies:
  frontend_next:
